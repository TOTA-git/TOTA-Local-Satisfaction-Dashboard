name: Scheduled Data Refresh

on:
  schedule:
    - cron: '47 17 * * *'
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      # Set up R
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Install R package dependencies
      - name: Install R Package Dependencies
        run: |
          Rscript -e 'install.packages(c("httr", "jsonlite", "readr", "dplyr", "tidyr", "lubridate", "httr2", "stringr"))'

      # Run data refresh script
      - name: Run data refresh script
        env:
          STATEMENTS: ${{ secrets.STATEMENTS }}
          PERCEPTIONS: ${{ secrets.PERCEPTIONS }}
        run: |
          Rscript -e 'source("data_refresh.R")'

      # Commit and push updated cached datasets
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/
          git diff-index --quiet HEAD || git commit -m "Automated data refresh: $(date +'%Y-%m-%d')"
          git push
